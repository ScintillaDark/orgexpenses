name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: bcmath, curl, mbstring, pdo_sqlite, xml, zip
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run tests
        run: php artisan test
